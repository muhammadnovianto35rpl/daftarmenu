<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Menu Warung Malang</title>
  <style>

    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 20px;
    }

    #menu-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .judul-utama {
      text-align: center;
      color: #333;
    }

    .kategori-menu {
      margin-top: 20px;
    }

    .judul-kategori {
      border-bottom: 2px solid #e74c3c;
      padding-bottom: 5px;
      color: #e74c3c;
    }

    .daftar-menu {
      list-style-type: none;
      padding: 0;
    }

    .item-menu {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dashed #ddd;
    }

    .nama-makanan {
      font-weight: bold;
      color: #2c3e50;
    }

    .harga {
      color: #27ae60;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <main id="menu-container">
    <h1 class="judul-utama">Menu Warung Malang</h1>

    <section id="kategori-makanan" class="kategori-menu">
      <h2 class="judul-kategori">Makanan Utama</h2>
      <ul class="daftar-menu">
        <li class="item-menu">
          <span class="nama-makanan">Nasi Goreng merah</span>
          <span class="harga">Rp 25.000</span>
        </li>
        <li class="item-menu">
          <span class="nama-makanan">nasi goreng tempe</span>
          <span class="harga">Rp 20.000</span>
        <li class="item-menu">
          <span class="nama-makanan">Babi guling</span>
          <span class="harga">Rp 65.000</span>
        </li>
        <li class="item-menu">
          <span class="nama-makanan">Soto Ayam Madura</span>
          <span class="harga">Rp 20.000</span>
        <li class="item-menu">
          <span class="nama-makanan">Babi kecap</span>
          <span class="harga">Rp 55.000</span>
        </li>
      </ul>
    </section>


    <section id="kategori-minuman" class="kategori-menu">
      <h2 class="judul-kategori">Minuman</h2>
      <ul class="daftar-menu">
        <li class="item-menu">
          <span class="nama-makanan">Es Teh Manis</span>
          <span class="harga">Rp 5.000</span>
        </li>
        <li class="item-menu">
          <span class="nama-makanan">Es Jeruk</span>
          <span class="harga">Rp 7.000</span>
        <li class="item-menu">
          <span class="nama-makanan">Aneka jus</span>
          <span class="harga">Rp 15.000</span>
        </li>
      </ul>
    </section>
  </main>

</body>
</html>
